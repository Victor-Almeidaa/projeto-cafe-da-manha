<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Café da manhã da equipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BJE6RwVf.css">
</head>
<body>
  <header class="topo">
    <h1>Café da manhã da equipe</h1>
    <p>Escolha o dia no calendário e cadastre o que você vai levar.</p>
    <button type="button" id="btn-sair" class="secundario" hidden>Sair</button>
  </header>

  <section id="auth-area" class="cartao auth-area" aria-label="Acesso à conta">
    <h2 id="auth-titulo">Entrar</h2>
    <form id="form-auth" novalidate>
      <div id="campos-cadastro-conta" hidden>
        <label for="auth-nome">Nome completo</label>
        <input id="auth-nome" type="text" autocomplete="name" placeholder="Maria Silva">
        <label for="auth-cpf">CPF</label>
        <input id="auth-cpf" type="text" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="000.000.000-00">
      </div>
      <label for="auth-email">E-mail</label>
      <input id="auth-email" type="email" autocomplete="email" required>
      <label for="auth-senha">Senha</label>
      <input id="auth-senha" type="password" autocomplete="current-password" minlength="6" required>
      <p id="mensagem-auth" class="mensagem" role="status"></p>
      <button type="submit" id="btn-auth">Entrar</button>
    </form>
    <button type="button" id="btn-alternar-auth" class="link-auth">Criar conta</button>
  </section>

  <main id="app-area" class="painel" hidden>
    <!-- Calendário -->
    <section class="cartao" aria-label="Calendário">
      <div class="mes-nav">
        <button type="button" id="mes-anterior" aria-label="Mês anterior">‹</button>
        <h2 id="mes-titulo"></h2>
        <button type="button" id="mes-proximo" aria-label="Próximo mês">›</button>
      </div>
      <div class="semana">
        <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
      </div>
      <div id="dias" class="dias"></div>
      <p class="legenda"><span class="bolinha"></span> dias com café marcado</p>
    </section>

    <!-- Cadastro -->
    <section class="cartao" aria-label="Cadastro">
      <h2>Novo cadastro</h2>
      <form id="form-cadastro" novalidate>
        <label for="data">Data do café</label>
        <input id="data" type="date" required>

        <label for="item">O que você vai levar</label>
        <div class="linha-item">
          <input id="item" type="text" placeholder="Pão, bolo, suco…" autocomplete="off">
          <button type="button" id="btn-add-item" class="secundario">Adicionar</button>
        </div>
        <ul id="lista-itens" class="chips" aria-live="polite"></ul>

        <p id="mensagem" class="mensagem" role="status"></p>
        <button type="submit" id="btn-salvar">Salvar cadastro</button>
      </form>
    </section>

    <!-- Tabela -->
    <section class="cartao tabela-area" aria-label="Participantes">
      <h2 id="tabela-titulo">Participantes</h2>
      <div class="rolagem">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Vai levar</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="JS/script.js"></script>
</body>
</html>
